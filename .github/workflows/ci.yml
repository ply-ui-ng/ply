# Free-tier CI on ply-ui-ng/ply
#
# The hub sync PAT cannot create workflow files. Publish this file once
# with a token that has the `workflow` scope (or via SSH), then leave it
# on the public repo. scripts/stage-public-hub.sh copies it into the
# staged tree; rsync still excludes `.github/workflows` so a later sync
# cannot overwrite it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  free-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json
      - run: npm ci
      - run: npm test

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: packages/mcp/package-lock.json
      - run: npm ci
      - run: npm test
