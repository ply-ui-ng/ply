<div class="calendar-container">
    <!-- Header -->
    <div class="flex items-center justify-between mb-4 px-2">
        <p class="text-sm font-semibold text-slate-900 dark:text-white m-0!" [id]="monthLabelId">
            {{ months[viewDate().getMonth()] }} {{ viewDate().getFullYear() }}
        </p>
        <div class="flex gap-1">
            <button ply-icon-button color="transparent" size="sm" (click)="prevMonth()"
                [attr.aria-label]="i18n.previousMonth" [attr.title]="i18n.previousMonth">
                <ply-icon name="chevron-left" class="w-4 h-4 stroke-slate-500 hover:stroke-blue-500" aria-hidden="true"></ply-icon>
            </button>
            <button ply-icon-button color="transparent" size="sm" (click)="nextMonth()"
                [attr.aria-label]="i18n.nextMonth" [attr.title]="i18n.nextMonth">
                <ply-icon name="chevron-right" class="w-4 h-4 stroke-slate-500 hover:stroke-blue-500" aria-hidden="true"></ply-icon>
            </button>
        </div>
    </div>

    <!-- Grid -->
    <div class="flex flex-col gap-y-1" role="grid" tabindex="-1" [id]="panelId()" [attr.aria-labelledby]="monthLabelId"
        (keydown)="onGridKeydown($event)">
        <div role="row" class="grid grid-cols-7">
            @for (day of weekDays; track $index) {
            <div role="columnheader"
                class="h-8 flex items-center justify-center text-[10px] uppercase font-bold text-slate-400 dark:text-slate-500">
                {{ day }}
            </div>
            }
        </div>

        @for (week of weeks(); track $index) {
        <div role="row" class="grid grid-cols-7">
            @for (calDate of week; track calDate.date.getTime()) {
            <div role="gridcell" [attr.tabindex]="dayTabIndex(calDate)"
                [attr.aria-label]="dayAriaLabel(calDate)"
                [attr.aria-selected]="calDate.isSelected || calDate.isRangeStart || calDate.isRangeEnd || calDate.isInRange"
                [attr.aria-current]="calDate.isToday ? 'date' : null"
                (click)="selectDate(calDate)" (keydown.enter)="selectDate(calDate)" [class]="getCellClasses(calDate)">
                <span [class]="getDayClasses(calDate)">
                    {{ calDate.date.getDate() }}
                </span>
            </div>
            }
        </div>
        }
    </div>
</div>
