@if (isMetric()) {
  <div class="flex items-start justify-between gap-3">
    <p class="truncate text-[11px] font-bold uppercase tracking-[0.18em] text-slate-400 m-0!">
      {{ label() }}
    </p>
    @if (showDeltaPill()) {
      <span [class]="deltaPillClass()">
        <ply-icon
          [name]="up() ? 'trend-up' : 'trend-down'"
          [class]="deltaIconClass()"></ply-icon>
        {{ deltaLabel() }}
      </span>
    }
  </div>

  <p
    class="truncate text-[30px] font-black leading-none tracking-tight text-slate-900 tabular-nums dark:text-white m-0!">
    {{ value() }}
  </p>

  @if (showSparkline()) {
    <svg
      class="-mx-1 mt-auto h-12 w-full"
      [attr.viewBox]="sparklineViewBox"
      preserveAspectRatio="none"
      role="img"
      [attr.aria-label]="(label() || 'Metric') + ' trend'">
      <polyline
        fill="none"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
        vector-effect="non-scaling-stroke"
        [attr.points]="sparklinePoints()"
        [class]="sparklineStrokeClass()"></polyline>
    </svg>
  }

  @if (caption()) {
    <p class="text-xs text-slate-400 m-0!">{{ caption() }}</p>
  }
} @else {
  <div
    class="flex items-start gap-4 rounded-xl border border-slate-200 bg-white p-6 dark:border-slate-700 dark:bg-slate-800">
    @if (icon()) {
      <div [class]="iconBgClasses() + ' flex h-12 w-12 min-w-12 items-center justify-center rounded-xl'">
        <ply-icon [name]="icon()" [class]="iconStrokeClasses() + ' h-6 w-6'"></ply-icon>
      </div>
    }
    <div class="min-w-0 flex-1">
      <p class="mb-1! truncate text-sm text-slate-500 dark:text-slate-400">{{ label() }}</p>
      <p class="mb-2! truncate text-2xl font-bold text-slate-900 dark:text-white">{{ value() }}</p>
      @if (trend()) {
        <div class="flex items-center gap-1.5">
          <span
            [class]="trendUp() ? 'text-green-600 dark:text-green-400' : 'text-red-600 dark:text-red-400'"
            class="flex items-center gap-1 text-xs font-semibold">
            <ply-icon
              [name]="trendUp() ? 'arrow-up' : 'arrow-down'"
              [class]="
                (trendUp()
                  ? 'stroke-green-600 dark:stroke-green-400'
                  : 'stroke-red-600 dark:stroke-red-400') + ' h-3 w-3'
              ">
            </ply-icon>
            {{ trend() }}
          </span>
          @if (caption()) {
            <span class="text-xs text-slate-400 dark:text-slate-500">{{ caption() }}</span>
          }
        </div>
      }
    </div>
  </div>
}
