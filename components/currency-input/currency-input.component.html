<div
  class="flex h-9 w-full items-center overflow-hidden rounded-lg border border-slate-300 bg-white dark:border-slate-700 dark:bg-slate-800"
  [class.opacity-50]="disabled()"
  [class.pointer-events-none]="disabled()">
  @if (showSymbol()) {
    <span class="shrink-0 px-3 text-sm text-slate-500 dark:text-slate-400" aria-hidden="true">
      {{ symbol() }}
    </span>
  }
  <input
    type="text"
    inputmode="decimal"
    autocomplete="off"
    class="h-9 min-h-9 w-full appearance-none bg-transparent px-2 text-sm text-slate-900 outline-none placeholder:text-slate-400 disabled:cursor-not-allowed dark:text-slate-100 dark:placeholder:text-slate-500"
    [class.pl-3]="!showSymbol()"
    [value]="displayText()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [attr.aria-label]="ariaLabel()"
    (input)="onInput($event)"
    (focus)="onFocus()"
    (blur)="onBlur()" />
</div>
