<div class="flex flex-col overflow-hidden rounded-lg bg-slate-100 dark:bg-slate-900">
  <div class="flex items-center justify-between px-4 py-2"
    [class.border-b]="showCode()" [class.border-slate-200]="showCode()" [class.dark:border-slate-700]="showCode()">
    <h4 class="m-0! text-sm font-semibold text-slate-700 dark:text-slate-200">{{ language() }}</h4>
    <div class="flex gap-2">
      <button ply-icon-button color="transparent" (click)="show()"
        [ply-tooltip]="showCode() ? 'Hide code' : 'Show code'" tooltipPlacement="bottom"
        [attr.aria-label]="showCode() ? 'Hide code' : 'Show code'">
        <ply-icon name="code"></ply-icon>
      </button>
      @if (showCode()) {
      <button
        ply-icon-button
        color="transparent"
        [@buttonSlideRightToLeft]
        (click)="copyTo()"
        (mouseleave)="resetCopyTooltip()"
        [ply-tooltip]="copyTooltip()"
        tooltipPlacement="bottom"
        [attr.aria-label]="copyTooltip()"
      >
        <ply-icon name="copy"></ply-icon>
      </button>
      }
    </div>
  </div>
  @if (showCode()) {
  <div
    #content
    class="max-w-full overflow-hidden bg-slate-100 p-4 font-mono text-sm text-slate-800 dark:bg-black dark:text-slate-200 [&_pre]:m-0! [&_pre]:bg-transparent! [&_pre]:p-0! [&_pre]:text-inherit!"
    [@openClose]>
    <ng-content></ng-content>
  </div>
  }
</div>
