<div class="flex items-end gap-2 rounded-2xl border border-slate-200 bg-slate-100/90 px-3 py-1.5 transition-colors duration-200 focus-within:border-[var(--ply-primary)] focus-within:bg-white dark:border-slate-700 dark:bg-slate-800 dark:focus-within:bg-slate-800">
  <textarea
    #composer
    rows="1"
    class="block h-8 min-h-8 w-full resize-none appearance-none overflow-hidden border-0 bg-transparent py-1.5 text-[13px] leading-5 text-slate-900 outline-none placeholder:text-slate-400 dark:text-white"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [ngModel]="draft()"
    (ngModelChange)="draft.set($event)"
    (input)="resizeComposer()"
    (keydown)="onKeydown($event)"
    [attr.aria-label]="placeholder()"></textarea>
  @if (streaming()) {
    <button
      type="button"
      ply-icon-button
      color="danger"
      size="sm"
      class="rounded-full! shrink-0"
      [attr.aria-label]="i18n.stopGenerating"
      (click)="stop.emit()">
      <ply-icon name="stop" class="h-3.5 w-3.5 stroke-current"></ply-icon>
    </button>
  } @else {
    <button
      type="button"
      ply-icon-button
      color="primary"
      size="sm"
      class="rounded-full! shrink-0"
      [attr.aria-label]="i18n.sendMessage"
      [disabled]="!canSend()"
      (click)="submit()">
      <ply-icon name="arrow-right" class="h-3.5 w-3.5 stroke-current"></ply-icon>
    </button>
  }
</div>
