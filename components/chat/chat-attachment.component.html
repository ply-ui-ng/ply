<span
  class="inline-flex max-w-full items-center gap-2.5 rounded-xl border border-slate-200 bg-white px-2.5 py-1.5 transition-colors duration-200 hover:border-slate-300 dark:border-slate-700 dark:bg-slate-800 dark:hover:border-slate-500">
  <span class="flex h-7 w-7 shrink-0 items-center justify-center rounded-lg bg-[var(--ply-primary-soft)] text-[var(--ply-primary)]">
    <ply-icon name="file-text" class="h-3.5 w-3.5 stroke-current"></ply-icon>
  </span>
  <span class="min-w-0">
    <span class="block truncate text-xs font-semibold text-slate-800 dark:text-slate-100">{{ name() }}</span>
    @if (detail()) {
      <span class="block text-[11px] tabular-nums text-slate-500 dark:text-slate-400">{{ detail() }}</span>
    }
  </span>
</span>
